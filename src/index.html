<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tidewell Insurance: file and track claims</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Tidewell: an Angular demo of an insurance claims portal with a multi-step claim form and a staff review workflow."
    />
    <meta name="theme-color" content="#0f766e" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tidewell" />
    <meta property="og:title" content="Tidewell: Angular insurance claims portal" />
    <meta
      property="og:description"
      content="Multi-step claim form with async validation, uploads and drafts, plus a staff portal with a role-based approval workflow."
    />
    <meta property="og:url" content="https://tidewell-claim.vercel.app/" />
    <meta property="og:image" content="https://tidewell-claim.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tidewell staff portal: a claim in review with approve and reject locked for an agent"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://tidewell-claim.vercel.app/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before Angular boots to avoid a light/dark flash.
      try {
        var t = JSON.parse(localStorage.getItem('tidewell.theme'));
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
